services:
  # Development Service (Hot Reload)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # Production Service (Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
